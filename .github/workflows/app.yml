name: AppBuild

on:
  push:
    tags: [ "app-*" ]

permissions:
  contents: write

jobs:
  build-flatpak:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y org.gnome.Platform//51 org.gnome.Sdk//51 \
            org.freedesktop.Sdk.Extension.rust-stable//26.08 \
            org.freedesktop.Sdk.Extension.llvm22//26.08

      - name: Build Flatpak
        run: |
          flatpak-builder --user --install --force-clean build-dir \
            bubbles-app/de.gonicus.bubbles.yml

      - name: Bundle Flatpak
        run: |
          flatpak build-bundle ~/.local/share/flatpak/repo \
            de.gonicus.bubbles.flatpak de.gonicus.bubbles

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            de.gonicus.bubbles.flatpak
