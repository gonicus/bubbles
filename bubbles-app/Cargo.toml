[package]
name = "bubbles"
version = "1.3.3"
edition = "2021"
license = "MIT"

[dependencies]
libc = "0.2"
relm4 = { version = "0.10.0", features = ["css", "macros", "libadwaita", "gnome_48"] }
tokio = { version = "1.47", features = ["fs", "net", "io-util", "time"] }
gtk = { version = "0.10", package = "gtk4" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
http-body-util = "0.1.3"
getrandom = "0.4"
hex = "0.4"
ashpd = { version = "0.13.13", features = ["dynamic_launcher"] }
