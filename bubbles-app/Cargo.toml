[package]
name = "bubbles"
version = "1.2.6"
edition = "2021"
license = "MIT"

[dependencies]
libc = "0.2"
relm4 = { version = "0.10.0", features = ["css", "macros", "libadwaita", "gnome_48"] }
tokio = { version = "1.47", features = ["fs", "net", "io-util", "time"] }
gtk = { version = "0.10", package = "gtk4" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13", default-features = false }
